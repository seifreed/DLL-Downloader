name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  validate-and-build:
    name: Validate And Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ensure tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -m pip show dll-downloader | awk '/^Version: / {print $2}')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Run Ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run MyPy
        run: mypy dll_downloader tests

      - name: Run Bandit security scan
        run: bandit -c pyproject.toml -r dll_downloader

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit

      - name: Run tests with coverage
        run: pytest --cov=dll_downloader --cov-report=xml --cov-report=term-missing

      - name: Enforce critical coverage thresholds
        run: python scripts/check_critical_coverage.py

      - name: Enforce module guardrails
        run: python scripts/check_module_guardrails.py

      - name: Enforce governance guardrails
        run: python scripts/check_governance_requirements.py

      - name: Enforce structural doc sync
        run: python scripts/check_structural_docs_sync.py

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish To PyPI
    needs: validate-and-build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/dll-downloader
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  github-release:
    name: Publish GitHub Release
    needs: validate-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Detect prerelease
        id: prerelease
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ -(rc|beta|alpha|dev|pre)([.0-9]+)?$ ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.value }}
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
