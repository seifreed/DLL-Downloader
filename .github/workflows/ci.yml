name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref so queued jobs do not pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / py3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run MyPy
        run: mypy dll_downloader tests

      - name: Run Bandit security scan
        run: bandit -c pyproject.toml -r dll_downloader

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit

      - name: Run tests with coverage
        run: pytest --cov=dll_downloader --cov-report=xml --cov-report=term-missing

      - name: Enforce critical coverage thresholds
        run: python scripts/check_critical_coverage.py

      - name: Enforce module guardrails
        run: python scripts/check_module_guardrails.py

      - name: Enforce governance guardrails
        run: python scripts/check_governance_requirements.py

      - name: Enforce structural doc sync
        run: python scripts/check_structural_docs_sync.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  sbom:
    name: SBOM quality / 10.0-A
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SBOMQS_VERSION: "2.0.8"
      SBOMQS_SHA256: "c8853906556245fe80f6ecea6015c057736701a1f763a1274ba5326b29fe1a5b"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install sbomqs (pinned + checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/interlynk-io/sbomqs/releases/download/v${SBOMQS_VERSION}/sbomqs_${SBOMQS_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL "$url" -o sbomqs.tar.gz
          echo "${SBOMQS_SHA256}  sbomqs.tar.gz" | sha256sum -c -
          tar -xzf sbomqs.tar.gz sbomqs
          install -m 0755 sbomqs /usr/local/bin/sbomqs
          rm -f sbomqs sbomqs.tar.gz
          sbomqs version

      - name: Generate CycloneDX SBOM
        run: python scripts/generate_sbom.py -o sbom.cdx.json

      - name: Enforce SBOM quality (10.0/A on NTIA + BSI profiles)
        run: python scripts/check_sbom_quality.py sbom.cdx.json --badge sbom-score.json

      - name: Verify the committed SBOM badge matches the real score
        run: git diff --exit-code sbom-score.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  tests:
    # Windows is intentionally excluded: the persistence and use-case layers
    # rely on POSIX-only primitives (fcntl advisory locks and O_NOFOLLOW for
    # symlink-safe opens) that are not available on Windows.
    #
    # macOS is excluded too: GitHub-hosted macOS runners are not assigned to
    # this repository, so those matrix jobs only queued indefinitely. Re-add
    # macos-15 / macos-15-intel when runner availability is restored.
    name: >-
      ${{ matrix.target.platform }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        target:
          - platform: linux-x64
            arch: x64
            runs-on: ubuntu-24.04
          - platform: linux-arm64
            arch: arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run cross-platform test suite
        run: pytest -q
