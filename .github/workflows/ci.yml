name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref so queued jobs (notably the
# concurrency-limited macOS runners) do not pile up indefinitely.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / py3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run MyPy
        run: mypy dll_downloader tests

      - name: Run Bandit security scan
        run: bandit -c pyproject.toml -r dll_downloader

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit

      - name: Run tests with coverage
        run: pytest --cov=dll_downloader --cov-report=xml --cov-report=term-missing

      - name: Enforce critical coverage thresholds
        run: python scripts/check_critical_coverage.py

      - name: Enforce module guardrails
        run: python scripts/check_module_guardrails.py

      - name: Enforce governance guardrails
        run: python scripts/check_governance_requirements.py

      - name: Enforce structural doc sync
        run: python scripts/check_structural_docs_sync.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  sbom:
    name: SBOM quality / 10.0-A
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SBOMQS_VERSION: "2.0.8"
      SBOMQS_SHA256: "c8853906556245fe80f6ecea6015c057736701a1f763a1274ba5326b29fe1a5b"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install sbomqs (pinned + checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/interlynk-io/sbomqs/releases/download/v${SBOMQS_VERSION}/sbomqs_${SBOMQS_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL "$url" -o sbomqs.tar.gz
          echo "${SBOMQS_SHA256}  sbomqs.tar.gz" | sha256sum -c -
          tar -xzf sbomqs.tar.gz sbomqs
          install -m 0755 sbomqs /usr/local/bin/sbomqs
          rm -f sbomqs sbomqs.tar.gz
          sbomqs version

      - name: Generate CycloneDX SBOM
        run: python scripts/generate_sbom.py -o sbom.cdx.json

      - name: Enforce SBOM quality (10.0/A on NTIA + BSI profiles)
        run: python scripts/check_sbom_quality.py sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  tests:
    # Windows is intentionally excluded: the persistence and use-case layers
    # rely on POSIX-only primitives (fcntl advisory locks and O_NOFOLLOW for
    # symlink-safe opens) that are not available on Windows.
    name: >-
      ${{ matrix.target.platform }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.target.runs-on }}
    # Bounds execution time once a runner is assigned. Note: this does NOT
    # cover time spent queued waiting for a runner (GitHub fails jobs that
    # stay queued ~24h), which is the current macOS-runner-availability limit.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        target:
          - platform: linux-x64
            arch: x64
            runs-on: ubuntu-24.04
          - platform: linux-arm64
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - platform: macos-intel
            arch: x64
            runs-on: macos-15-intel
          - platform: macos-arm64
            arch: arm64
            runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run cross-platform test suite
        run: pytest -q
