name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Quality / py3.13
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: mypy dll_downloader tests

      - name: Run Bandit security scan
        run: bandit -c pyproject.toml -r dll_downloader

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit

      - name: Run tests with coverage
        run: pytest --cov=dll_downloader --cov-report=xml --cov-report=term-missing

      - name: Enforce critical coverage thresholds
        run: python scripts/check_critical_coverage.py

      - name: Enforce module guardrails
        run: python scripts/check_module_guardrails.py

      - name: Enforce governance guardrails
        run: python scripts/check_governance_requirements.py

      - name: Enforce structural doc sync
        run: python scripts/check_structural_docs_sync.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  tests:
    # Windows is intentionally excluded: the persistence and use-case layers
    # rely on POSIX-only primitives (fcntl advisory locks and O_NOFOLLOW for
    # symlink-safe opens) that are not available on Windows.
    name: >-
      ${{ matrix.target.platform }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.target.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        target:
          - platform: linux-x64
            arch: x64
            runs-on: ubuntu-24.04
          - platform: linux-arm64
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - platform: macos-intel
            arch: x64
            runs-on: macos-15-intel
          - platform: macos-arm64
            arch: arm64
            runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run cross-platform test suite
        run: pytest -q
